# ==============================================================================
# Mosquitto MQTT Broker Configuration - Chay truc tiep tren Windows (khong can Docker)
# ==============================================================================

# Lang nghe port 1883 tren tat ca cac card mang
listener 1883 0.0.0.0

# Yeu cau xac thuc tai khoan (iot_user / iot_password123)
allow_anonymous false
password_file mosquitto/config/password_file

# In truc tiep log ra man hinh Console
log_dest stdout

connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
