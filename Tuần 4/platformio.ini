; PlatformIO Project Configuration File
; Bai thuc hanh 04: Gui du lieu qua MQTT - FreeRTOS & Queue

[platformio]
default_envs = web_control

[env:firmware_mqtt]
platform = espressif32
board = fm-devkit
framework = arduino
build_src_filter =
	-<*>
	+<../firmware/src/main.cpp>
monitor_speed = 115200
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.0.4
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14

[env:web_control]
platform = espressif32
board = fm-devkit
framework = arduino
build_src_filter =
	-<*>
	+<web_control/main.cpp>
monitor_speed = 115200
lib_deps =
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.14
