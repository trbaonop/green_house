# ==============================================================================
# Mosquitto MQTT Broker Configuration - Bai Thuc Hanh 04 (CSE3069)
# ==============================================================================

# Lang nghe cong 1883 tren tat ca cac interface mang
listener 1883 0.0.0.0

# Tat ket noi an danh (bat buoc xac thuc username/password)
allow_anonymous false

# Duong dan file mat khau da duoc ma hoa (mosquitto_passwd)
password_file /mosquitto/config/password_file

# Luu tru trang thai tin nhan persist (QoS 1, retain)
persistence true
persistence_location /mosquitto/data/

# Cau hinh nhat ky (log)
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

log_type error
log_type warning
log_type notice
log_type information

connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
